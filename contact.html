<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Nathan Ghabour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <a href="/" class="nav-logo">Nathan Ghabour</a>
    <div class="nav-links">
      <a href="/#work">Work</a>
      <a href="/about.html">About</a>
      <a href="/contact.html" class="active nav-cta">Get in touch</a>
    </div>
  </nav>

  <!-- HERO -->
  <div class="page-hero">
    <div class="page-hero-accent"></div>
    <h1>Let's Talk</h1>
    <p>Tell me about your challenge. I'll respond within 24 hours.</p>
  </div>

  <!-- CONTACT FORM + CALENDAR -->
  <div class="contact-section">

    <!-- PRIMARY: CONTACT FORM -->
    <div class="form-card">
      <form id="contact-form">

        <div class="form-group">
          <label for="name">Name <span class="form-required">*</span></label>
          <input type="text" id="name" name="name" required placeholder="Your name">
        </div>

        <div class="form-group">
          <label for="email">Email <span class="form-required">*</span></label>
          <input type="email" id="email" name="email" required placeholder="you@company.com">
        </div>

        <div class="form-group">
          <label for="company">Company</label>
          <input type="text" id="company" name="company" placeholder="Optional">
        </div>

        <div class="form-group">
          <label for="message">What are you looking to accomplish? <span class="form-required">*</span></label>
          <textarea id="message" name="message" required placeholder="Tell me about your challenge..."></textarea>
        </div>

        <div class="form-group">
          <label for="service">Which service area interests you?</label>
          <select id="service" name="service">
            <option value="">Select one...</option>
            <option value="sizing">Sizing &amp; Strategy</option>
            <option value="data">Data to Design</option>
            <option value="tech">Tech Adoption</option>
            <option value="workflow">Digital Workflow</option>
            <option value="innovation">Innovation Roadmap</option>
            <option value="unsure">Not sure yet</option>
          </select>
        </div>

        <div class="form-group">
          <label for="timeframe">Timeframe</label>
          <select id="timeframe" name="timeframe">
            <option value="">Select one...</option>
            <option value="immediate">Immediate</option>
            <option value="3months">Next 3 months</option>
            <option value="6months">Next 6 months</option>
            <option value="exploring">Exploring</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">Send message</button>
      </form>
    </div>

    <script>
      document.getElementById('contact-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var name     = document.getElementById('name').value;
        var email    = document.getElementById('email').value;
        var company  = document.getElementById('company').value;
        var message  = document.getElementById('message').value;
        var service  = document.getElementById('service').value;
        var timeframe = document.getElementById('timeframe').value;

        var subject = 'New inquiry from ' + name + (company ? ' (' + company + ')' : '');
        var body =
          'Name: ' + name + '\n' +
          'Email: ' + email + '\n' +
          (company ? 'Company: ' + company + '\n' : '') +
          (service  ? 'Service area: ' + service + '\n' : '') +
          (timeframe ? 'Timeframe: ' + timeframe + '\n' : '') +
          '\nMessage:\n' + message;

        window.location.href =
          'mailto:hello@nathanghabour.com' +
          '?subject=' + encodeURIComponent(subject) +
          '&body=' + encodeURIComponent(body);
      });
    </script>

    <!-- DIVIDER -->
    <div class="contact-divider">
      <span>or</span>
    </div>

    <!-- SECONDARY: CALENDAR -->
    <div class="calendar-card">
      <h3>Prefer to schedule directly?</h3>
      <p>Book a 30-minute discovery call to discuss your project.</p>
      <a href="https://calendar.app.google/raxVFKUH1ApF9yvz9" target="_blank" rel="noopener" class="calendar-btn">Book a call →</a>
    </div>

    <!-- LINKEDIN ONLY -->
    <div class="contact-links-section">
      <h4>Connect on LinkedIn</h4>
      <div class="contact-links">
        <a href="https://linkedin.com/in/nathanghabour" target="_blank" rel="noopener">linkedin.com/in/nathanghabour</a>
      </div>
    </div>

  </div>

</body>
</html>
